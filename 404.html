<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages: Redirect all 404s to index.html
    // This script will redirect any unmatched route back to the root,
    // allowing React Router to handle the correct component rendering.

    // Define the base path if your app is deployed in a subdirectory
    // For example, if deployed at "yourusername.github.io/my-repo/", set it to "/my-repo/"
    const basePath = "/"; 

    // The following line replaces the current URL with the base path and any original hash,
    // effectively letting React Router take over.
    window.location.replace(basePath); 
  </script>
  <noscript>
    <p>Please enable JavaScript to be redirected.</p>
  </noscript>
</head>
<body>
  <p>Redirecting to the homepage...</p>
</body>
</html>
